<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="业务管理系统" />
    <!--
      标签页图标：内联 SVG（不额外引入图片文件）。
      用「首」字 + 深蓝圆角底，和左上角徽标保持一致。
      Firefox 对 svg 图标的支持不稳定会退回默认图标，可接受；
      iOS/Safari 另加一个 apple-touch-icon 保证在移动端也显示同一图标。
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E9%A6%96%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E9%A6%96%3C/text%3E%3C/svg%3E"
    />
    <title>业务管理系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
